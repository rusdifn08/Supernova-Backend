[package]
name = "supernova-backend"
version = "0.1.0"
edition = "2021"
authors = ["Supernova Labs Studio <tech@supernovalabs.studio>"]
description = "Enterprise All-in-One Multiplatform Backend Engine (Booking, POS/ERP/CRM, QR Table Dine-in)"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1.54", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.28", features = ["serde", "v4"] }
dotenvy = "0.15"
thiserror = "2.0"
